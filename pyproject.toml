[project]
name = "hotel-booking-cancelation-prediction"
version = "0.1.0"
description = "Predict hotel booking cancellations with an Optuna-tuned XGBoost model, served via a Streamlit app"
readme = "README.md"
authors = [
    { name = "Sheikh faisal", email = "sheikhfaisalparvaiz786@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "joblib>=1.5.3",
    "lightgbm>=4.7.0",
    "matplotlib>=3.11.1",
    "numpy>=2.5.1",
    "optuna>=4.9.0",
    "pandas>=3.0.5",
    "scikit-learn>=1.9.0",
    "scipy>=1.18.0",
    "seaborn>=0.13.2",
    "streamlit>=1.60.0",
    "xgboost>=3.3.0",
]

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "nbclient>=0.11.0",
    "nbconvert>=7.17.1",
    "ruff>=0.16.0",
]
